name: FINN daily run

on:
  schedule:
    - cron: "15 4,7,10,13,16 * * *"
  workflow_dispatch:
    inputs:
      warm:
        description: "Also re-prepare the demo research memos"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: finn-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Model cache
        uses: actions/cache@v4
        with:
          path: .cache/llm
          key: llm-${{ github.run_id }}
          restore-keys: llm-

      - run: pip install -r pipeline/requirements.txt

      - name: Refresh filings and prices
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINN_APP_URL: ${{ vars.FINN_APP_URL }}
        run: python -m pipeline.run

      - name: Prepare demo research
        if: ${{ inputs.warm }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pipeline.warm_research

      - name: Commit data
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
